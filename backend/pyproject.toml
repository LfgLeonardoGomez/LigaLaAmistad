[project]
name = "app"
version = "0.1.0"
description = "api de la web de gestion de la liga La Amistad"
readme = "README.md"
authors = [
    { name = "Leonardo Gomez", email = "lfglfg0804@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "cloudinary>=1.45.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]



[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]
